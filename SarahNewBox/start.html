    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var inputFields = document.querySelectorAll('input[type="text"], input[type="date"]');
            inputFields.forEach(function(field) {
                field.addEventListener('click', function() {
                    field.value = '';
                });
            });
        });

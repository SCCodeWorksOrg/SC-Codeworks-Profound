body.hybrid-signon {
  display: flex;
  justify-content: center;  /* horizontal centering */
  align-items: center;      /* vertical centering */
  height: 100vh;            /* full viewport height */
  margin: 0;
  padding: 0;
  
  background-image: url('/profoundui/userdata/images/loginmain.png') !important;
  /*background-image: url('/profoundui/userdata/images/loginSCC.png') !important;*/
  background-size: cover;
  background-position: center;
}

body.hybrid-signon .insideDiv {
  margin: 0;
    margin-top: 90px; /* Push below fixed topDiv */
  display: flex;
  align-items: center;
  /*margin-top: 90px !important;*/
  padding: 0;
  text-align: center;
}
 body.hybrid-signon .topDiv{
  width: 100%;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  background-image:none !important;
  background-image: url('/profoundui/userdata/images/loginSCC.png') !important;
  /*background-image: -webkit-gradient(linear, right top, left bottom, color-stop(0.3, #172c59), color-stop(1, #069ed1));*/

 }
.middleDiv {
  
    margin-left: auto;
    margin-right: auto;
    height: calc(100vh - 75px); /* full height minus topDiv height */
    background-color: transparent !important; /* Make sure it's transparent */
}
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
}

 body.hybrid-signon .topDiv {

}
 body.hybrid-signon .hybrid-actions{
  visibility:hidden !important;
}
.hybrid-actions {
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
}

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var inputFields = document.querySelectorAll('input[type="text"], input[type="date"]');
            inputFields.forEach(function(field) {
                field.addEventListener('click', function() {
                    field.value = '';
                });
            });
        });
        
          /* Auto adjust zoom level dynamically based on window resize */
        window.addEventListener('resize', function () {
            document.body.style.zoom = 1 / window.devicePixelRatio;
